<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bosch · Sales Cloud Impediments</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root {
    --bg: #0b0f17;
    --bg-2: #0f1522;
    --panel: #151b2b;
    --panel-2: #1c2338;
    --panel-hover: #212a42;
    --border: #262f48;
    --border-hi: #334064;
    --text: #e8ecf4;
    --text-dim: #a8b1c7;
    --muted: #6b7693;
    --accent: #6ea8fe;
    --accent-2: #8b5cf6;

    --high: #f87171;
    --high-bg: rgba(248,113,113,0.12);
    --medium: #fbbf24;
    --medium-bg: rgba(251,191,36,0.12);
    --low: #4ade80;
    --low-bg: rgba(74,222,128,0.12);

    --open: #f87171;
    --review: #a78bfa;
    --inprogress: #60a5fa;
    --answer: #38bdf8;
    --notcovered: #94a3b8;
    --completed: #4ade80;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    background: radial-gradient(1200px 500px at 70% -100px, rgba(110,168,254,0.08), transparent 60%),
                radial-gradient(900px 400px at -200px 200px, rgba(139,92,246,0.06), transparent 60%),
                var(--bg);
    color: var(--text);
    font-size: 13px;
    line-height: 1.5;
    overflow: hidden;
  }

  /* ---------- Header ---------- */
  header {
    padding: 14px 20px 10px;
    display: flex; align-items: flex-end; gap: 20px;
    flex-wrap: wrap;
  }
  .brand h1 {
    margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.3px;
    display: flex; align-items: center; gap: 10px;
  }
  .brand h1 .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 10px var(--accent);
  }
  .brand .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }

  .project-tabs { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
  .project-tabs button {
    background: transparent; border: none; color: var(--text-dim);
    padding: 6px 12px; border-radius: 7px; font-size: 12px; font-weight: 500;
    cursor: pointer; transition: all 0.15s;
  }
  .project-tabs button:hover { color: var(--text); }
  .project-tabs button.active {
    background: linear-gradient(180deg, var(--panel-2), var(--panel-hover));
    color: var(--text); box-shadow: 0 1px 0 var(--border-hi);
  }

  .stats { display: flex; gap: 10px; margin-left: auto; }
  .stat {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; min-width: 100px;
    position: relative; overflow: hidden;
  }
  .stat .k { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
  .stat .v { font-size: 22px; font-weight: 700; margin-top: 2px; line-height: 1; }
  .stat .delta { color: var(--muted); font-size: 10px; margin-top: 2px; }
  .stat.danger { border-color: rgba(248,113,113,0.3); }
  .stat.danger .v { color: var(--high); }
  .stat.warn .v { color: var(--medium); }
  .stat.good .v { color: var(--low); }
  .stat::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: transparent;
  }
  .stat.danger::before { background: var(--high); }
  .stat.warn::before   { background: var(--medium); }
  .stat.good::before   { background: var(--low); }

  /* ---------- Filter bar ---------- */
  .filters {
    display: flex; gap: 8px; align-items: center; padding: 0 20px 12px;
    flex-wrap: wrap;
  }
  .search-wrap { position: relative; flex: 1; min-width: 260px; max-width: 420px; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .filters input[type=text] {
    width: 100%; background: var(--panel); border: 1px solid var(--border);
    color: var(--text); padding: 7px 10px 7px 32px; border-radius: 8px; font-size: 13px; outline: none;
    transition: border-color 0.15s;
  }
  .filters input[type=text]:focus { border-color: var(--accent); }
  .filters input[type=text]::placeholder { color: var(--muted); }
  .filters .kbd {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    font-family: ui-monospace, monospace; font-size: 10px; color: var(--muted);
    background: var(--panel-2); border: 1px solid var(--border); padding: 1px 5px; border-radius: 4px;
  }
  .filters select {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 7px 10px; border-radius: 8px; font-size: 12px; outline: none; cursor: pointer;
  }
  .filters select:focus { border-color: var(--accent); }
  .toggle {
    display: flex; align-items: center; gap: 6px; color: var(--text-dim); font-size: 12px; cursor: pointer;
    padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel);
    user-select: none;
  }
  .toggle input { accent-color: var(--accent); }
  .toggle:hover { border-color: var(--border-hi); }
  .clear {
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    padding: 7px 10px; border-radius: 8px; cursor: pointer; font-size: 12px;
  }
  .clear:hover { border-color: var(--border-hi); color: var(--text); }

  /* ---------- Board ---------- */
  main {
    display: grid;
    grid-template-columns: 1fr auto;
    height: calc(100vh - 150px);
    overflow: hidden;
  }
  .board {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(260px, 1fr);
    gap: 12px;
    padding: 4px 20px 20px;
    overflow-x: auto;
    overflow-y: hidden;
  }
  .column {
    display: flex; flex-direction: column;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    min-height: 0;
  }
  .column-header {
    padding: 10px 12px;
    display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, var(--panel), var(--bg-2));
    position: sticky; top: 0;
  }
  .column-swatch { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .column-title {
    font-weight: 600; font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.4px; color: var(--text);
    flex: 1;
  }
  .column-count {
    font-size: 11px; color: var(--muted); background: var(--panel-2);
    padding: 1px 7px; border-radius: 10px; font-weight: 600;
  }
  .cards {
    flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  .cards::-webkit-scrollbar { width: 6px; }
  .cards::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .card {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px 10px 14px;
    cursor: pointer;
    transition: transform 0.1s, border-color 0.15s, background 0.15s;
    overflow: hidden;
  }
  .card:hover { background: var(--panel-hover); border-color: var(--border-hi); transform: translateY(-1px); }
  .card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .card.showstopper { border-color: rgba(248,113,113,0.5); }
  .card.showstopper::after {
    content: ""; position: absolute; top: 0; right: 0;
    border-style: solid; border-width: 0 16px 16px 0;
    border-color: transparent var(--high) transparent transparent;
  }
  .card .stripe {
    position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 2px;
  }
  .card.p-high   .stripe { background: var(--high); }
  .card.p-medium .stripe { background: var(--medium); }
  .card.p-low    .stripe { background: var(--low); }
  .card.p-none   .stripe { background: var(--muted); }

  .card .eyebrow {
    display: flex; align-items: center; gap: 6px; margin-bottom: 4px;
    font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; font-weight: 600;
  }
  .card .eyebrow .comp { color: var(--text-dim); }
  .card .title { font-size: 12.5px; line-height: 1.4; color: var(--text); font-weight: 500;
                 display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card .chips { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
  .chip {
    font-size: 10px; padding: 1.5px 6px; border-radius: 10px; font-weight: 600;
    background: var(--panel-2); color: var(--text-dim); border: 1px solid var(--border);
    line-height: 1.5;
  }
  .chip.prio-high   { background: var(--high-bg);   color: var(--high);   border-color: rgba(248,113,113,0.3); }
  .chip.prio-medium { background: var(--medium-bg); color: var(--medium); border-color: rgba(251,191,36,0.3); }
  .chip.prio-low    { background: var(--low-bg);    color: var(--low);    border-color: rgba(74,222,128,0.3); }
  .chip.roadmap { background: rgba(110,168,254,0.1); color: var(--accent); border-color: rgba(110,168,254,0.25); }
  .chip.project { background: rgba(139,92,246,0.1); color: var(--accent-2); border-color: rgba(139,92,246,0.25); }
  .chip.has-note { background: rgba(74,222,128,0.1); color: var(--low); border-color: rgba(74,222,128,0.3); display: inline-flex; align-items: center; gap: 3px; }

  .empty-col {
    text-align: center; color: var(--muted); font-size: 11px;
    padding: 24px 8px; opacity: 0.6;
  }

  /* ---------- Side sheet ---------- */
  .detail {
    width: 0; overflow: hidden; background: var(--panel); border-left: 1px solid var(--border);
    transition: width 0.2s ease;
  }
  .detail.open { width: min(520px, 46vw); }
  .detail-inner { width: min(520px, 46vw); height: 100%; overflow-y: auto; padding: 20px 22px; }
  .detail-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .detail-head h2 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.4; flex: 1; }
  .detail-head .close {
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    width: 28px; height: 28px; border-radius: 7px; cursor: pointer; font-size: 16px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .detail-head .close:hover { border-color: var(--border-hi); color: var(--text); }
  .detail-sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; display: flex; gap: 8px; align-items: center; }
  .detail-sub .chip { font-size: 10px; }

  .kv-grid {
    display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px;
    font-size: 12.5px; padding: 12px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  }
  .kv-grid .k { color: var(--muted); }
  .kv-grid .v { word-break: break-word; white-space: pre-wrap; color: var(--text-dim); }
  .kv-grid .v a { color: var(--accent); text-decoration: none; }
  .kv-grid .v a:hover { text-decoration: underline; }

  .longtext { margin-top: 14px; }
  .longtext .block { background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .longtext .block h4 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); font-weight: 600; }
  .longtext .block p { margin: 0; font-size: 12.5px; color: var(--text-dim); white-space: pre-wrap; word-break: break-word; }

  .notes-section { margin-top: 18px; padding-top: 14px; border-top: 2px dashed var(--accent); }
  .notes-section .notes-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .notes-section .notes-head svg { color: var(--accent); }
  .notes-section .notes-head label { font-weight: 600; font-size: 13px; color: var(--text); }
  .notes-section .notes-head .saved { font-size: 10px; color: var(--muted); margin-left: auto; }
  .notes-section textarea {
    width: 100%; min-height: 180px; max-height: 50vh;
    background: var(--bg-2); border: 1px solid var(--border); color: var(--text);
    padding: 10px 12px; border-radius: 8px; font-family: inherit;
    font-size: 13px; resize: vertical; outline: none; line-height: 1.5;
  }
  .notes-section textarea:focus { border-color: var(--accent); }

  .nav-arrows { display: flex; gap: 6px; align-items: center; margin-top: 12px; }
  .nav-arrows button {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text-dim);
    padding: 5px 10px; border-radius: 7px; cursor: pointer; font-size: 11px; display: flex; align-items: center; gap: 4px;
  }
  .nav-arrows button:hover { border-color: var(--border-hi); color: var(--text); }
  .nav-arrows button:disabled { opacity: 0.4; cursor: not-allowed; }
  .nav-arrows .pos { font-size: 10px; color: var(--muted); margin-left: auto; font-family: ui-monospace, monospace; }

  .footer-hint {
    position: fixed; bottom: 10px; left: 20px; color: var(--muted); font-size: 10px;
    font-family: ui-monospace, monospace; opacity: 0.6;
  }
  .footer-hint kbd { background: var(--panel-2); border: 1px solid var(--border); border-radius: 3px; padding: 1px 4px; font-size: 10px; }

  /* ---------- Refresh button + toast ---------- */
  .refresh-btn {
    display: inline-flex; align-items: center; gap: 7px;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--border);
    color: var(--text); font-size: 12px; font-weight: 500;
    padding: 7px 12px; border-radius: 10px; cursor: pointer;
    transition: all 0.15s;
    position: relative;
  }
  .refresh-btn:hover { border-color: var(--accent); color: var(--text); }
  .refresh-btn:disabled { opacity: 0.6; cursor: wait; }
  .refresh-btn svg { transition: transform 0.6s; }
  .refresh-btn.spinning svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .refresh-btn .dot-status {
    width: 6px; height: 6px; border-radius: 50%; background: var(--low);
    box-shadow: 0 0 6px var(--low);
  }
  .refresh-btn.err .dot-status { background: var(--high); box-shadow: 0 0 6px var(--high); }
  .refresh-btn.readonly { opacity: 0.55; cursor: not-allowed; }
  .refresh-btn.readonly:hover { border-color: var(--border); }

  .toast {
    position: fixed; top: 14px; right: 20px; z-index: 100;
    background: var(--panel-2); border: 1px solid var(--border-hi);
    border-radius: 10px; padding: 12px 16px; min-width: 240px; max-width: 360px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    display: flex; align-items: flex-start; gap: 10px;
    opacity: 0; transform: translateY(-10px); pointer-events: none;
    transition: all 0.2s;
  }
  .toast.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .toast.ok { border-left: 3px solid var(--low); }
  .toast.err { border-left: 3px solid var(--high); }
  .toast.info { border-left: 3px solid var(--accent); }
  .toast .title { font-weight: 600; font-size: 13px; color: var(--text); margin-bottom: 2px; }
  .toast .body { font-size: 12px; color: var(--text-dim); line-height: 1.4; }
  .toast .x { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 14px; }
  .toast .x:hover { color: var(--text); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1><span class="dot"></span>Bosch · Sales Cloud Impediments</h1>
    <div class="sub" id="sub">loading…</div>
  </div>

  <div class="project-tabs" id="project-tabs">
    <button data-project="sales" class="active">Sales focus</button>
    <button data-project="Sales Cloud">Sales only</button>
    <button data-project="Sales + Service Cloud">Sales + Service</button>
    <button data-project="Service Cloud">Service</button>
    <button data-project="all">All</button>
  </div>

  <div class="stats" id="stats"></div>

  <button class="refresh-btn" id="refresh-btn" title="Refresh from SharePoint">
    <span class="dot-status"></span>
    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
    <span id="refresh-label">Refresh</span>
  </button>
</header>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="filters">
  <div class="search-wrap">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="text" id="search" placeholder="Search description, component, comments, Bosch/SAP ref…" autocomplete="off">
    <span class="kbd">/</span>
  </div>
  <select id="component"><option value="">All components</option></select>
  <select id="priority">
    <option value="">All priorities</option>
    <option value="High">High</option>
    <option value="Medium">Medium</option>
    <option value="Low">Low</option>
  </select>
  <select id="roadmap"><option value="">All roadmap</option></select>
  <label class="toggle"><input type="checkbox" id="only-notes"> Only my notes</label>
  <label class="toggle"><input type="checkbox" id="only-showstopper"> Showstoppers</label>
  <button class="clear" id="clear">Clear</button>
</div>

<main>
  <div class="board" id="board"></div>
  <aside class="detail" id="detail"><div class="detail-inner" id="detail-inner"></div></aside>
</main>

<div class="footer-hint">
  <kbd>/</kbd> search · <kbd>Esc</kbd> close · <kbd>↑</kbd><kbd>↓</kbd> navigate in column
</div>

<script>
const NOTES_KEY = 'bosch-tracker-notes-v1';
const PRIORITY_ORDER = { 'high': 0, 'medium': 1, 'low': 2, '': 3 };

const COLUMNS = [
  { id: 'Open',                    label: 'Open',               color: 'var(--open)' },
  { id: 'Customer Review',         label: 'Customer Review',    color: 'var(--review)' },
  { id: 'In Progress',             label: 'In Progress',        color: 'var(--inprogress)' },
  { id: 'Answer Provided',         label: 'Answer Provided',    color: 'var(--answer)' },
  { id: 'Not Covered as Standard', label: 'Not Covered',        color: 'var(--notcovered)' },
  { id: 'Completed',               label: 'Completed',          color: 'var(--completed)' },
];

let DATA = { rows: [], generated_at: '' };
let CURRENT_ID = null;
let FILTERED = []; // flat list after filters, for keyboard nav

function loadNotes() { try { return JSON.parse(localStorage.getItem(NOTES_KEY) || '{}'); } catch { return {}; } }
function saveNotes(n) { localStorage.setItem(NOTES_KEY, JSON.stringify(n)); }
function hasNote(id) { const n = loadNotes()[id]; return !!(n && n.text && n.text.trim()); }

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function linkify(text) {
  const esc = escapeHtml(text);
  return esc.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}
function priorityKey(p) { return (p || '').trim().toLowerCase(); }
function priorityClass(p) {
  const k = priorityKey(p);
  if (['high','medium','low'].includes(k)) return 'p-' + k;
  return 'p-none';
}
function priorityChipClass(p) {
  const k = priorityKey(p);
  if (['high','medium','low'].includes(k)) return 'prio-' + k;
  return '';
}
function isShowstopper(r) { return /^y/i.test((r.showstopper || '').trim()); }

/* ---------- Filtering ---------- */
let STATE = { project: 'sales', search: '', component: '', priority: '', roadmap: '', onlyNotes: false, onlyShowstopper: false };

function applyFilters() {
  const q = STATE.search.trim().toLowerCase();
  const notes = loadNotes();
  return DATA.rows.filter(r => {
    if (STATE.project === 'sales') {
      if (!(r.project || '').toLowerCase().includes('sales')) return false;
    } else if (STATE.project !== 'all') {
      if (r.project !== STATE.project) return false;
    }
    if (STATE.component && r.component !== STATE.component) return false;
    if (STATE.priority && (r.priority || '').trim() !== STATE.priority) return false;
    if (STATE.roadmap && (r.roadmap || '').trim() !== STATE.roadmap) return false;
    if (STATE.onlyNotes && !hasNote(r.id)) return false;
    if (STATE.onlyShowstopper && !isShowstopper(r)) return false;
    if (q) {
      const hay = [r.component, r.description, r.comments, r.next_steps, r.roadmap, r.bosch_reference, r.sap_reference, r.incident_id]
        .join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

/* ---------- Rendering ---------- */
function renderStats(rows) {
  const all = DATA.rows;
  const total = rows.length;
  const showstoppers = rows.filter(isShowstopper).length;
  const openHigh = rows.filter(r => r.in_progress === 'Open' && priorityKey(r.priority) === 'high').length;
  const completed = rows.filter(r => r.in_progress === 'Completed').length;
  const inProg = rows.filter(r => ['In Progress','Customer Review','Answer Provided'].includes(r.in_progress)).length;

  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="k">Visible</div><div class="v">${total}</div><div class="delta">of ${all.length} total</div></div>
    <div class="stat danger"><div class="k">Showstoppers</div><div class="v">${showstoppers}</div><div class="delta">${showstoppers === 0 ? 'none in view' : 'need attention'}</div></div>
    <div class="stat warn"><div class="k">Open · High</div><div class="v">${openHigh}</div><div class="delta">${inProg} actively moving</div></div>
    <div class="stat good"><div class="k">Completed</div><div class="v">${completed}</div><div class="delta">${total ? Math.round(100*completed/total) : 0}% of view</div></div>
  `;
}

function renderBoard(rows) {
  const board = document.getElementById('board');
  const notes = loadNotes();

  // Group rows by status
  const buckets = new Map(COLUMNS.map(c => [c.id, []]));
  const other = []; // anything that doesn't fit a known column
  rows.forEach(r => {
    const s = r.in_progress || '';
    if (buckets.has(s)) buckets.get(s).push(r);
    else other.push(r);
  });

  // Sort inside each bucket: showstopper first, then priority asc, then component
  const sorter = (a, b) => {
    const sa = isShowstopper(a) ? 0 : 1;
    const sb = isShowstopper(b) ? 0 : 1;
    if (sa !== sb) return sa - sb;
    const pa = PRIORITY_ORDER[priorityKey(a.priority)] ?? 4;
    const pb = PRIORITY_ORDER[priorityKey(b.priority)] ?? 4;
    if (pa !== pb) return pa - pb;
    return (a.component || '').localeCompare(b.component || '');
  };
  buckets.forEach(arr => arr.sort(sorter));
  other.sort(sorter);

  // Flat sequence for keyboard nav = column order concatenated
  FILTERED = [];
  COLUMNS.forEach(c => FILTERED.push(...buckets.get(c.id)));
  FILTERED.push(...other);

  // Columns rendered only if non-empty, OR always-on core columns
  const corePresent = new Set(['Open', 'In Progress', 'Customer Review', 'Completed']);

  board.innerHTML = COLUMNS
    .filter(c => corePresent.has(c.id) || buckets.get(c.id).length > 0)
    .map(c => {
      const items = buckets.get(c.id);
      return `
        <div class="column">
          <div class="column-header">
            <span class="column-swatch" style="background:${c.color}"></span>
            <span class="column-title">${c.label}</span>
            <span class="column-count">${items.length}</span>
          </div>
          <div class="cards" data-col="${c.id}">
            ${items.length ? items.map(r => cardHtml(r, notes)).join('') :
              `<div class="empty-col">Nothing in ${c.label.toLowerCase()}.</div>`}
          </div>
        </div>
      `;
    }).join('') + (other.length ? `
      <div class="column">
        <div class="column-header">
          <span class="column-swatch" style="background: var(--muted)"></span>
          <span class="column-title">Other</span>
          <span class="column-count">${other.length}</span>
        </div>
        <div class="cards" data-col="__other">
          ${other.map(r => cardHtml(r, notes)).join('')}
        </div>
      </div>` : '');

  // Attach handlers (delegated would also work)
  board.querySelectorAll('.card').forEach(el => {
    el.addEventListener('click', () => openDetail(el.dataset.id));
    if (el.dataset.id === CURRENT_ID) el.classList.add('active');
  });
}

function cardHtml(r, notes) {
  const prio = (r.priority || '').trim();
  const roadmap = (r.roadmap || '').trim();
  const showstopper = isShowstopper(r);
  const noted = notes[r.id] && notes[r.id].text && notes[r.id].text.trim();
  const projectShort = r.project === 'Sales + Service Cloud' ? 'Sales+Service'
                     : r.project === 'Sales Cloud' ? 'Sales'
                     : r.project === 'Service Cloud' ? 'Service'
                     : r.project || '';

  return `
    <div class="card ${priorityClass(prio)} ${showstopper ? 'showstopper' : ''}" data-id="${r.id}">
      <div class="stripe"></div>
      <div class="eyebrow">
        <span class="comp">${escapeHtml(r.component || '—')}</span>
      </div>
      <div class="title">${escapeHtml(r.description || '(no description)')}</div>
      <div class="chips">
        ${prio ? `<span class="chip ${priorityChipClass(prio)}">${escapeHtml(prio)}</span>` : ''}
        ${roadmap ? `<span class="chip roadmap">📅 ${escapeHtml(roadmap)}</span>` : ''}
        ${projectShort ? `<span class="chip project">${escapeHtml(projectShort)}</span>` : ''}
        ${noted ? `<span class="chip has-note">✎ noted</span>` : ''}
      </div>
    </div>
  `;
}

/* ---------- Side sheet ---------- */
function openDetail(id) {
  const r = DATA.rows.find(x => x.id === id);
  if (!r) return;
  CURRENT_ID = id;

  const panel = document.getElementById('detail');
  const inner = document.getElementById('detail-inner');
  panel.classList.add('open');

  const notes = loadNotes();
  const note = notes[id] || { text: '', updated: '' };
  const prio = (r.priority || '').trim();
  const idx = FILTERED.findIndex(x => x.id === id);

  const metaRows = [
    ['Component', r.component],
    ['Project', r.project],
    ['Status', r.in_progress],
    ['Priority', prio],
    ['Showstopper', r.showstopper],
    ['Roadmap', r.roadmap],
    ['Date voiced', r.date_voiced],
    ['Incident ID', r.incident_id],
    ['Bosch ref', r.bosch_reference],
    ['SAP ref', r.sap_reference],
    ['Influence', r.influence],
    ['Help doc', r.help],
  ].filter(([,v]) => v && String(v).trim());

  inner.innerHTML = `
    <div class="detail-head">
      <h2>${escapeHtml(r.description)}</h2>
      <button class="close" onclick="closeDetail()" title="Close (Esc)">×</button>
    </div>
    <div class="detail-sub">
      ${prio ? `<span class="chip ${priorityChipClass(prio)}">${escapeHtml(prio)}</span>` : ''}
      <span class="chip">${escapeHtml(r.in_progress || '—')}</span>
      ${isShowstopper(r) ? '<span class="chip prio-high">⚠ showstopper</span>' : ''}
      <span style="color:var(--muted);">${escapeHtml(r.component)} · ${escapeHtml(r.project)}</span>
    </div>

    <div class="kv-grid">
      ${metaRows.map(([k,v]) => `<div class="k">${k}</div><div class="v">${linkify(String(v))}</div>`).join('')}
    </div>

    <div class="longtext">
      ${r.next_steps ? `<div class="block"><h4>Next steps</h4><p>${linkify(r.next_steps)}</p></div>` : ''}
      ${r.comments   ? `<div class="block"><h4>Comments</h4><p>${linkify(r.comments)}</p></div>` : ''}
    </div>

    <div class="notes-section">
      <div class="notes-head">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <label for="note-ta">My notes &amp; updates</label>
        <span class="saved" id="saved-indicator">${note.updated ? 'Saved ' + new Date(note.updated).toLocaleString() : 'Not saved yet'}</span>
      </div>
      <textarea id="note-ta" placeholder="Add your own follow-ups, decisions, who to chase, what Bosch expects next…">${escapeHtml(note.text)}</textarea>
    </div>

    <div class="nav-arrows">
      <button id="prev-btn" ${idx <= 0 ? 'disabled' : ''}>← Prev</button>
      <button id="next-btn" ${idx >= FILTERED.length - 1 ? 'disabled' : ''}>Next →</button>
      <span class="pos">${idx + 1} / ${FILTERED.length}</span>
    </div>
  `;

  const ta = document.getElementById('note-ta');
  let timer;
  ta.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      const n = loadNotes();
      n[id] = { text: ta.value, updated: new Date().toISOString() };
      saveNotes(n);
      document.getElementById('saved-indicator').textContent = 'Saved ' + new Date().toLocaleString();
      // Repaint cards so the has-note chip reflects the change — but keep this card active
      renderAll({ keepDetail: true });
    }, 300);
  });

  document.getElementById('prev-btn').onclick = () => navigate(-1);
  document.getElementById('next-btn').onclick = () => navigate(1);

  document.querySelectorAll('.card').forEach(el => el.classList.toggle('active', el.dataset.id === id));
  // Scroll active card into view
  const activeEl = document.querySelector(`.card[data-id="${id}"]`);
  if (activeEl) activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function closeDetail() {
  CURRENT_ID = null;
  document.getElementById('detail').classList.remove('open');
  document.querySelectorAll('.card').forEach(el => el.classList.remove('active'));
}
window.closeDetail = closeDetail;

function navigate(delta) {
  if (!CURRENT_ID) return;
  const idx = FILTERED.findIndex(r => r.id === CURRENT_ID);
  const next = FILTERED[idx + delta];
  if (next) openDetail(next.id);
}

/* ---------- Full render pipeline ---------- */
function renderAll(opts = {}) {
  const rows = applyFilters();
  renderStats(rows);
  renderBoard(rows);
  if (opts.keepDetail && CURRENT_ID) {
    document.querySelectorAll('.card').forEach(el => el.classList.toggle('active', el.dataset.id === CURRENT_ID));
  } else if (CURRENT_ID && !rows.some(r => r.id === CURRENT_ID)) {
    closeDetail();
  }
}

/* ---------- Dropdown populate ---------- */
function populateSelect(id, values, placeholder) {
  const el = document.getElementById(id);
  const current = el.value;
  el.innerHTML = `<option value="">${placeholder}</option>` +
    [...new Set(values.filter(v => v && v.trim()))].sort()
      .map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');
  el.value = current;
}

/* ---------- Load ---------- */
async function load() {
  const resp = await fetch('data/data.json?_=' + Date.now());
  DATA = await resp.json();
  const gen = new Date(DATA.generated_at);
  document.getElementById('sub').textContent =
    `${DATA.row_count} impediments · last synced ${gen.toLocaleString()}`;

  populateSelect('component', DATA.rows.map(r => r.component), 'All components');
  populateSelect('roadmap', DATA.rows.map(r => (r.roadmap || '').trim()), 'All roadmap');

  renderAll();
}

/* ---------- Events ---------- */
document.getElementById('project-tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-project]');
  if (!b) return;
  STATE.project = b.dataset.project;
  document.querySelectorAll('#project-tabs button').forEach(x => x.classList.toggle('active', x === b));
  renderAll();
});

document.getElementById('search').addEventListener('input', e => { STATE.search = e.target.value; renderAll(); });
document.getElementById('component').addEventListener('change', e => { STATE.component = e.target.value; renderAll(); });
document.getElementById('priority').addEventListener('change', e => { STATE.priority = e.target.value; renderAll(); });
document.getElementById('roadmap').addEventListener('change', e => { STATE.roadmap = e.target.value; renderAll(); });
document.getElementById('only-notes').addEventListener('change', e => { STATE.onlyNotes = e.target.checked; renderAll(); });
document.getElementById('only-showstopper').addEventListener('change', e => { STATE.onlyShowstopper = e.target.checked; renderAll(); });
document.getElementById('clear').addEventListener('click', () => {
  STATE = { project: 'sales', search: '', component: '', priority: '', roadmap: '', onlyNotes: false, onlyShowstopper: false };
  document.getElementById('search').value = '';
  document.getElementById('component').value = '';
  document.getElementById('priority').value = '';
  document.getElementById('roadmap').value = '';
  document.getElementById('only-notes').checked = false;
  document.getElementById('only-showstopper').checked = false;
  document.querySelectorAll('#project-tabs button').forEach(x => x.classList.toggle('active', x.dataset.project === 'sales'));
  renderAll();
});

/* ---------- Keyboard ---------- */
window.addEventListener('keydown', e => {
  const inField = ['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName);
  if (e.key === '/' && !inField) {
    e.preventDefault();
    document.getElementById('search').focus();
    document.getElementById('search').select();
  }
  if (e.key === 'Escape') {
    if (inField && e.target.id === 'search') { e.target.value = ''; STATE.search = ''; renderAll(); e.target.blur(); return; }
    closeDetail();
  }
  if (!inField && CURRENT_ID) {
    if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); navigate(1); }
    if (e.key === 'ArrowUp'   || e.key === 'k') { e.preventDefault(); navigate(-1); }
  }
});

/* ---------- Refresh button + toast ---------- */
const IS_LOCAL = /^(localhost|127\.0\.0\.1|0\.0\.0\.0)$/.test(location.hostname);
// Local file:// loads treat hostname as '', which is fine — we fall back to localhost API only when truly local
const REFRESH_API = `http://${location.hostname || 'localhost'}:3001/api/bosch-refresh`;

function showToast(kind, title, body, ms = 4500) {
  const t = document.getElementById('toast');
  t.className = 'toast ' + kind;
  t.innerHTML = `
    <div style="flex:1;">
      <div class="title">${escapeHtml(title)}</div>
      <div class="body">${escapeHtml(body || '')}</div>
    </div>
    <button class="x" onclick="document.getElementById('toast').classList.remove('show')">×</button>
  `;
  requestAnimationFrame(() => t.classList.add('show'));
  if (ms > 0) {
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(() => t.classList.remove('show'), ms);
  }
}

function setupRefreshButton() {
  const btn = document.getElementById('refresh-btn');
  const label = document.getElementById('refresh-label');

  if (!IS_LOCAL) {
    // Deployed on GitHub Pages — can't hit SharePoint from here.
    // Keep button but repurpose: just reload data.json from GitHub.
    label.textContent = 'Reload';
    btn.title = 'Pull latest data.json (auto-refreshed daily from your Mac)';
    btn.addEventListener('click', async () => {
      btn.classList.add('spinning'); btn.disabled = true;
      try {
        await load();
        showToast('ok', 'Data reloaded', `${DATA.row_count} rows · synced ${new Date(DATA.generated_at).toLocaleString()}`);
      } catch (e) {
        showToast('err', 'Reload failed', String(e));
      } finally {
        btn.classList.remove('spinning'); btn.disabled = false;
      }
    });
    return;
  }

  // Local: full refresh pipeline via API
  btn.addEventListener('click', async () => {
    btn.classList.add('spinning'); btn.disabled = true;
    label.textContent = 'Refreshing…';
    showToast('info', 'Refreshing from SharePoint', 'Running pipeline in the background. This takes 10–20 seconds.', 0);
    try {
      const res = await fetch(REFRESH_API, { method: 'POST' });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
      await load();
      const extras = [];
      if (data.pushed) extras.push('pushed to GitHub Pages');
      showToast('ok', 'Refresh complete',
        `${data.rows} rows · ${new Date(data.generatedAt).toLocaleString()}${extras.length ? ' · ' + extras.join(' · ') : ''}`);
    } catch (e) {
      showToast('err', 'Refresh failed',
        `${String(e).replace('Error: ', '')}. Check Chrome CDP is up on port 9222 and signed into SharePoint.`,
        8000);
      btn.classList.add('err');
      setTimeout(() => btn.classList.remove('err'), 3000);
    } finally {
      btn.classList.remove('spinning'); btn.disabled = false; label.textContent = 'Refresh';
    }
  });
}
setupRefreshButton();

load();
</script>
</body>
